<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FinVision AI</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:850px;margin:50px auto;padding:20px;background:#f7f7f7;color:#222}
    .card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:24px;margin:15px 0}
    .value{font-size:28px;font-weight:bold;margin-top:8px}
    small{color:#666}
    button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-size:16px;margin:5px}
    #status{margin-top:15px;font-weight:bold}
  </style>
</head>
<body>
  <h1>FinVision AI</h1>
  <p>منصة ذكية لتحليل المخاطر والتنبؤ بالأسواق</p>

  <div class="card"><small>الأصل</small><div id="asset" class="value">—</div></div>
  <div class="card"><small>مستوى المخاطرة</small><div id="risk" class="value">—</div></div>
  <div class="card"><small>الاتجاه المتوقع</small><div id="trend" class="value">—</div></div>
  <div class="card"><small>مشاعر الأخبار</small><div id="sentiment" class="value">—</div></div>

  <button onclick="checkHealth()">اختبار الاتصال بالخدمة</button>
  <button onclick="loadRisk()">إجراء تحليل المخاطر</button>
  <div id="status">الخدمة جاهزة للاختبار.</div>

  <p><small>Educational analysis only — لا يمثل تداولًا حقيقيًا أو نصيحة استثمارية.</small></p>

  <script>
    async function checkHealth(){
      const status=document.getElementById('status');
      status.textContent='جاري اختبار الاتصال...';
      try{
        const r=await fetch('/health');
        const d=await r.json();
        status.textContent = d.status === 'ok' ? '✅ الخدمة تعمل بنجاح على السحابة.' : '⚠️ الخدمة استجابت بحالة غير متوقعة.';
      }catch(e){
        status.textContent='❌ تعذر الاتصال بالخدمة.';
      }
    }

    async function loadRisk(){
      const status=document.getElementById('status');
      status.textContent='جاري تحميل التحليل...';
      try{
        const r=await fetch('/risk-summary');
        const d=await r.json();
        document.getElementById('asset').textContent=d.asset;
        document.getElementById('risk').textContent=d.risk_level === 'medium' ? 'متوسط' : d.risk_level;
        document.getElementById('trend').textContent=d.predicted_trend === 'up' ? 'صعود' : d.predicted_trend;
        document.getElementById('sentiment').textContent=d.sentiment === 'neutral' ? 'محايد' : d.sentiment;
        status.textContent='✅ تم الحصول على التحليل من API السحابي.';
      }catch(e){
        status.textContent='❌ تعذر الحصول على التحليل.';
      }
    }
  </script>
</body>
</html>
